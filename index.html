<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">

    <script>
      (function(){var t;try{t=localStorage.getItem('slot-theme')}catch(e){}
      if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'night':'day';
      document.documentElement.dataset.theme=t;})();
    </script>

    <title>Slot</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
